<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Security Operations Center</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="dashboard">
    <h1>👑 🛡️ AI Security Operations Center</h1>

    <section class="cards">
      <div class="card">
        <p>Threat Level</p>
        <h2>MEDIUM</h2>
      </div>

      <div class="card">
        <p>Threat Score</p>
        <h2>20</h2>
      </div>

      <div class="card">
        <p>Total Requests</p>
        <h2>1</h2>
      </div>

      <div class="card">
        <p>Blocked Requests</p>
        <h2>1</h2>
      </div>
    </section>

    <section class="card wide">
      <h2>RAG Security Status</h2>
      <p>Trust scoring, context poisoning detection, and secure prompt generation are active.</p>
    </section>

    <a class="button" href="/">Back to Home</a>
  </main>

  <script src="./script.js"></script>
</body>
</html>
